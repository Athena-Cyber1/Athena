<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Athéna v10.9.4 · design noir &amp; blanc · HUD sélecteur de modèle (cloud + local, cascade sans secret)</title>
  <meta name="description" content="Athéna — agent à boucle planifier → agir → observer → vérifier → sous-agent. Mono-modèle (aucun juge 0.5B), design monochrome (blanc &amp; noir / noir &amp; blanc, liens rouges, symboles sans émoji, sans pied de page), thèmes importables, réponses vérifiées par outils d'autorité, échecs honnêtes." />
  <meta name="keywords" content="Athéna, agent, IA, vérification, sous-agent, traçabilité" />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="stylesheet" href="./athena-demo.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-geist-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-geist-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="page-demo">
    <div id="app">
      <!-- ————— Barre latérale ————— -->
      <aside id="sidebar" class="sidebar" aria-label="Barre latérale">
        <div class="side-head">
          <div class="marque">
            <span class="marque-icone" aria-hidden="true">◆</span>
            <span class="marque-nom">Athéna</span>
            <span class="marque-version">v10.9.4</span>
          </div>
        </div>

        <div class="side-corps">
          <button id="nouvelle-discussion" type="button" class="btn-nouvelle">
            <span aria-hidden="true">＋</span> Nouvelle discussion
          </button>

          <div class="side-bloc">
            <div class="side-bloc-titre">
              <span>Conversations</span>
            </div>
            <div class="side-recherche">
              <input
                id="recherche-conversations"
                type="search"
                class="recherche"
                placeholder="Rechercher…"
                aria-label="Rechercher une conversation"
                autocomplete="off"
              />
              <button
                id="plier-conversations"
                type="button"
                class="plier"
                title="Plier / déplier la liste"
                aria-label="Plier la liste des conversations"
                aria-expanded="true"
                aria-controls="liste-conversations"
              >▾</button>
            </div>
            <nav id="liste-conversations" class="liste-conversations" aria-label="Conversations"></nav>
            <p id="aucun-resultat" class="aucun-resultat" hidden>Aucun résultat pour cette recherche.</p>
          </div>

          <div class="side-section">
            <div class="side-section-titre">
              <span>Projets</span>
              <button
                id="ajouter-projet"
                type="button"
                class="btn-plus"
                title="Nouveau projet (conversation épinglée)"
                aria-label="Nouveau projet"
              >＋</button>
            </div>
            <div id="liste-projets"></div>
            <p class="project-empty">Aucun projet épinglé.</p>
          </div>
        </div>

        <div class="side-pied">
          <div class="side-actions">
            <button id="ouvrir-projets" type="button" class="side-onglet">
              <span class="onglet-ico" aria-hidden="true">▣</span>
              <span class="onglet-lib">Projets</span>
            </button>
            <button id="ouvrir-parametres" type="button" class="side-onglet">
              <span class="onglet-ico" aria-hidden="true">⚙︎</span>
              <span class="onglet-lib">Paramètres</span>
            </button>
            <button id="btn-theme" type="button" class="side-onglet">
              <span class="onglet-ico" aria-hidden="true">◐</span>
              <span class="onglet-lib">Thème…</span>
            </button>
          </div>

          <div class="compte-wrap">
            <button
              id="ouvrir-compte"
              type="button"
              class="compte-bouton"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="menu-compte"
            >
              <span class="avatar" aria-hidden="true">N</span>
              <span class="compte-infos">
                <span class="compte-nom">Neyzoxx</span>
                <small>Plan gratuit · local</small>
              </span>
            </button>
            <div id="menu-compte" class="menu-compte" hidden role="menu" aria-label="Menu du compte">
              <button id="gerer-compte" type="button" role="menuitem"><span aria-hidden="true">⊙</span> Gérer le compte</button>
              <button id="preferences-compte" type="button" role="menuitem"><span aria-hidden="true">⚙︎</span> Préférences</button>
              <button id="aide-compte" type="button" role="menuitem"><span aria-hidden="true">?</span> Aide et assistance</button>
            </div>
          </div>
        </div>
      </aside>

      <!-- ————— Zone de discussion ————— -->
      <main class="chat-shell">
        <header class="chat-tete">
          <button
            id="bascule-sidebar"
            type="button"
            class="bascule"
            title="Réduire la barre latérale (Ctrl+B)"
            aria-label="Réduire la barre latérale"
            aria-expanded="true"
            aria-controls="sidebar"
          >
            <span class="bascule-ico" aria-hidden="true">☰</span>
          </button>
          <div class="chat-marque">
            <h1>Athéna</h1>
          </div>
          <div class="etat-moteur" role="status" aria-label="État du moteur">
            <span id="dot" class="dot" aria-hidden="true"></span>
            <span id="statut">vérification…</span>
          </div>
          <!-- v10.9.4 (HUD) — sélecteur de modèle de langue -->
          <div class="hud-modele-wrap">
            <button
              id="btn-modele"
              type="button"
              class="btn-modele"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="hud-modeles"
              title="Modèle de langue — auto = cascade (gratuit → zai)"
            >
              <span id="modele-actif-nom" class="modele-actif-nom">auto</span>
              <span class="modele-ico" aria-hidden="true">▾</span>
            </button>
            <div id="hud-modeles" class="hud-modeles" hidden role="dialog" aria-label="Choisir le modèle de langue"></div>
          </div>
        </header>

        <div id="msgs" class="msgs" role="log" aria-live="polite" aria-label="Fil de discussion"></div>

        <div id="file-preview" class="file-preview" aria-live="polite"></div>

        <form id="form" class="composeur">
          <div class="composeur-carte">
            <button
              id="attacher"
              type="button"
              class="btn-attacher"
              title="Joindre un fichier (Alt+A)"
              aria-label="Joindre un fichier"
            >＋</button>
            <input
              id="saisie"
              name="saisie"
              type="text"
              class="saisie"
              autocomplete="off"
              placeholder="Écrivez à Athéna — je planifie, j'agis, je vérifie…"
              aria-label="Votre message"
            />
            <span id="compteur-saisie" class="compteur-saisie" aria-live="off">0 / 4000</span>
            <button id="btn" type="submit" class="btn-envoyer" title="Envoyer" aria-label="Envoyer">↵</button>
          </div>
          <input id="fichiers" type="file" multiple hidden aria-hidden="true" tabindex="-1" />
        </form>
      </main>
    </div>

    <!-- Chargeur de thème importé (/api/design) AVANT l'application. -->
    <script src="./theme-loader.js"></script>
    <!-- Clés API des modèles cloud (voir keys.js) + interception /api/* → providers réels. -->
    <script src="./keys.js?v=20260923a"></script>
    <script src="./api-shim.js?v=20260923a"></script>
    <script src="./chat-demo.js?v=20260923a"></script>
  </div>
</body>
</html>
