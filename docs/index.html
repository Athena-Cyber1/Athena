<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>/* v20260926l : thème avant le premier rendu (pas de flash). */
    try { var p = JSON.parse(localStorage.getItem('chat-preferences') || '{}'); document.documentElement.dataset.theme = (p && p.theme === 'light') ? 'light' : 'dark'; } catch (e) {}</script>
  <title>Athéna — assistant</title>
  <meta name="description" content="Athena" />
  <meta name="keywords" content="Athena" />
  <link rel="icon" type="image/svg+xml" href="./design/logo.svg" />
  <link rel="stylesheet" href="./design/athena-demo.css?v=20260925cs" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-geist-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-geist-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
  </style>
  <style>
    /* v20260926h : Inter auto-hébergée (./fonts) — plus proche équivalent
       libre de Styrene (police de Claude). woff2 latin, swap, zéro CDN. */
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("./fonts/inter-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("./fonts/inter-500.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("./fonts/inter-700.woff2") format("woff2");
    }
  </style>
</head>
<body>
  <div class="page-demo">
    <div id="app">
      <!-- ————— Barre latérale ————— -->
      <aside id="sidebar" class="sidebar" aria-label="Barre latérale">
        <div class="side-corps">
          <div class="side-brand">
            <span>Athena</span>
          </div>
          <button id="nouvelle-discussion" type="button" class="btn-nouvelle">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Nouvelle discussion
          </button>

          <nav class="side-nav" aria-label="Navigation principale">
            <button id="nav-projets" class="side-nav-item" type="button">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7A2.5 2.5 0 0 1 6 4.5h3.2L11 6.5H18A2.5 2.5 0 0 1 20.5 9v7.5A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5z"/></svg>
              <span>Projets</span>
            </button>
            <button id="nav-artefacts" class="side-nav-item" type="button">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 7 4-7 4-7-4 7-4Z"/><path d="m5 12 7 4 7-4M5 17l7 4 7-4"/></svg>
              <span>Artefacts</span>
            </button>
            <button id="nav-code" class="side-nav-item" type="button">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg>
              <span>Code</span>
              <span class="nav-badge">Mettre à niveau</span>
            </button>
            <button id="nav-personnaliser" class="side-nav-item" type="button">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h16v11H4zM8 8.5V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2.5M4 12h16M10 12v2h4v-2"/></svg>
              <span>Personnaliser</span>
            </button>
          </nav>

          <div class="side-bloc">
            <div class="side-bloc-titre">
              <span>Discussions et tâches</span>
              <button id="filtre-discussions" class="filtre-discussions" type="button" title="Filtrer les discussions" aria-label="Filtrer les discussions">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
              </button>
            </div>
            <div class="side-recherche">
              <input
                id="recherche-conversations"
                type="search"
                class="recherche"
                placeholder="Rechercher…"
                aria-label="Rechercher une conversation"
                autocomplete="off"
              />
              <button
                id="plier-conversations"
                type="button"
                class="plier"
                title="Plier / déplier la liste"
                aria-label="Plier la liste des conversations"
                aria-expanded="true"
                aria-controls="liste-conversations"
              ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
            </div>
            <nav id="liste-conversations" class="liste-conversations" aria-label="Conversations"></nav>
            <p id="aucun-resultat" class="aucun-resultat" hidden>Aucun résultat pour cette recherche.</p>
          </div>

          <div class="side-section">
            <div class="side-section-titre">
              <span>Projets</span>
              <button
                id="ajouter-projet"
                type="button"
                class="btn-plus"
                title="Nouveau projet (conversation épinglée)"
                aria-label="Nouveau projet"
              ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
            <div id="liste-projets"></div>
            <p class="project-empty">Aucun projet épinglé.</p>
          </div>
        </div>

        <div class="side-pied">
          <!-- v20260926n : le compte est la 3e icône des utilitaires. -->
          <div class="side-utilitaires">
            <button id="telecharger-conversations" type="button" title="Télécharger les conversations" aria-label="Télécharger les conversations">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0 3.5-3.5M12 14.5 8.5 11M5 19.5h14"/></svg>
            </button>
            <button id="rechercher-conversations" type="button" title="Rechercher une discussion" aria-label="Rechercher une discussion">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            </button>
            <button id="ouvrir-journal" type="button" title="Journal et requêtes envoyées" aria-label="Journal et requêtes envoyées">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>
            </button>
            <div class="compte-wrap">
              <button
                id="ouvrir-compte"
                type="button"
                class="compte-bouton"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="menu-compte"
                title="Compte"
              >
                <span class="avatar" aria-hidden="true">N</span>
                <span class="compte-infos">
                  <span class="compte-nom">Neyzoxx</span>
                  <small>Free</small>
                </span>
              </button>
              <div id="menu-compte" class="menu-compte" hidden role="menu" aria-label="Menu du compte">
                <button id="gerer-compte" type="button" role="menuitem"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5.5 19.5c1.4-3 3.8-4.5 6.5-4.5s5.1 1.5 6.5 4.5"/></svg> Gérer le compte</button>
                <button id="preferences-compte" type="button" role="menuitem"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h8M17.5 7.5H20M4 16.5h3.5M13 16.5H20"/><circle cx="14.5" cy="7.5" r="2.2"/><circle cx="10" cy="16.5" r="2.2"/></svg> Préférences</button>
                <button id="aide-compte" type="button" role="menuitem"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.6a2.4 2.4 0 1 1 3.3 2.2c-.7.3-1 .9-1 1.6v.3"/><path d="M12 16.8h.01"/></svg> Aide et assistance</button>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- ————— Zone de discussion ————— -->
      <main class="chat-shell">
        <header class="chat-tete">
          <button
            id="bascule-sidebar"
            type="button"
            class="bascule"
            title="Réduire la barre latérale (Ctrl+B)"
            aria-label="Réduire la barre latérale"
            aria-expanded="true"
            aria-controls="sidebar"
          >
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
          </button>
          <div class="chat-marque">
            <h1 id="titre-conversation">Nouvelle discussion</h1>
          </div>
          <div class="zone-fichiers">
            <button
              id="liste-fichiers"
              class="btn-fichiers"
              type="button"
              title="Fichiers de la conversation"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="panneau-fichiers"
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7A2.5 2.5 0 0 1 6 4.5h3.2L11 6.5h7A2.5 2.5 0 0 1 20.5 9v7.5A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5z"/></svg>
              <span>Fichiers</span>
            </button>
            <div id="panneau-fichiers" class="panneau-fichiers" hidden role="menu" aria-label="Fichiers de la conversation"></div>
          </div>
          <!-- v1.5 : le bouton ouvre un HUD DOCKÉ À DROITE (coquille du rendu
               de l'interpréteur). Le HUD lui-même vit AU NIVEAU DU CORPS,
               à côté de #interpreteur : un position:fixed reste prisonnier
               d'un ancêtre transformé/flouté, donc un HUD imbriqué dans
               l'en-tête n'aurait que la hauteur de l'en-tête. -->
          <button id="btn-navigateur" type="button" class="btn-fichiers btn-nav" aria-expanded="false" aria-controls="hud-navigateur" title="Navigateur du modèle — clique dans la page pour naviguer, molette pour défiler, clavier pour saisir">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.4 2.6 3.6 5.6 3.6 9s-1.2 6.4-3.6 9c-2.4-2.6-3.6-5.6-3.6-9S9.6 5.6 12 3z"/></svg>
            <span class="hnav-lbl">Navigateur</span>
            <span id="navigateur-actif-nom" class="hnav-badge">…</span>
          </button>
          <button id="partager" class="btn-partager" type="button" title="Copier la conversation">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
            <span>Partager</span>
          </button>
        </header>

        <div id="msgs" class="msgs" role="log" aria-live="polite" aria-label="Fil de discussion"></div>

        <div id="file-preview" class="file-preview" aria-live="polite"></div>

        <form id="form" class="composeur">
          <div class="composeur-carte">
            <button
              id="attacher"
              type="button"
              class="btn-attacher"
              title="Joindre un fichier (Alt+A)"
              aria-label="Joindre un fichier"
            ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            <div class="saisie-zone">
              <span id="saisie-mirror" class="saisie-mirror" aria-hidden="true"></span>
              <textarea
                id="saisie"
                name="saisie"
                class="saisie"
                rows="1"
                maxlength="4000"
                autocomplete="off"
                placeholder="Écrivez votre message…"
                aria-label="Votre message"
              ></textarea>
            </div>
            <span id="compteur-saisie" class="compteur-saisie" aria-live="off">0 / 4000</span>
            <button id="btn" type="submit" class="btn-envoyer" title="Envoyer" aria-label="Envoyer">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 10l-5 5 5 5M4 15h11a4 4 0 0 0 4-4V7"/></svg>
            </button>
          </div>
          <div class="composeur-pied">
            <span>Les IA peuvent commettre des erreurs. Vérifiez les réponses.</span>
            <div class="composeur-modele">
              <div class="hud-modele-wrap hud-modele-bas">
                <button id="btn-modele" type="button" class="btn-modele" aria-haspopup="dialog" aria-expanded="false" aria-controls="hud-modeles" title="Modèle de langue — auto = cascade (gratuit → zai)">
                  <span id="modele-actif-nom" class="modele-actif-nom">auto</span>
                  <span class="modele-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
                </button>
                <div id="hud-modeles" class="hud-modeles" hidden role="dialog" aria-label="Choisir le modèle de langue"></div>
              </div>
              <!-- Effort de raisonnement : décalé à droite du bouton modèle
                   (celui-ci se retrouve donc poussé vers la gauche). -->
              <div class="hud-effort-wrap hud-effort-bas">
                <button id="btn-effort" type="button" class="btn-modele btn-effort" aria-haspopup="dialog" aria-expanded="false" aria-controls="hud-efforts" title="Effort de raisonnement — clic pour changer (low / high / max)">
                  <span class="effort-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg></span>
                  <span id="effort-actif-nom" class="modele-actif-nom effort-valeur">max</span>
                  <span class="modele-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
                </button>
                <div id="hud-efforts" class="hud-modeles hud-efforts" hidden role="dialog" aria-label="Choisir l'effort de raisonnement"></div>
              </div>
              <div class="hud-effort-wrap hud-effort-bas">
                <button id="btn-temp" type="button" class="btn-modele btn-effort" aria-haspopup="dialog" aria-expanded="false" aria-controls="hud-temp" title="Température des modèles — clic pour changer">
                  <span class="effort-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12h2l2-5 3 10 3-14 3 8 2-3h3"/></svg></span>
                  <span id="temp-actif-nom" class="modele-actif-nom effort-valeur">0.6</span>
                  <span class="modele-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
                </button>
                <div id="hud-temp" class="hud-modeles hud-efforts" hidden role="dialog" aria-label="Choisir la température"></div>
              </div>
              <div class="hud-effort-wrap hud-effort-bas">
                <button id="btn-contexte" type="button" class="btn-modele btn-effort" aria-haspopup="dialog" aria-expanded="false" aria-controls="hud-contexte" title="Contexte de la discussion — tokens utilisés et limite">
                  <span class="effort-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8"/><path d="M12 12l4-4"/></svg></span>
                  <span id="contexte-actif-nom" class="modele-actif-nom effort-valeur">–</span>
                </button>
                <div id="hud-contexte" class="hud-modeles hud-efforts" hidden role="dialog" aria-label="Contexte de la discussion"></div>
              </div>
              <!-- v banc 20261006 (§3 observabilité) : journal debug — payload,
                   modèle servi, finish_reason, usage et latence par appel. -->
              <div class="hud-effort-wrap hud-effort-bas">
                <button id="btn-journal" type="button" class="btn-modele btn-effort" aria-haspopup="dialog" aria-expanded="false" aria-controls="hud-journal" title="Journal debug : payload, modèle servi, finish_reason, usage et latence par appel">
                  <span class="effort-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
                  <span id="journal-actif-nom" class="modele-actif-nom effort-valeur">0</span>
                </button>
                <div id="hud-journal" class="hud-modeles hud-efforts" hidden role="dialog" aria-label="Journal debug des appels"></div>
              </div>
            </div>
          </div>
          <input id="fichiers" type="file" multiple hidden aria-hidden="true" tabindex="-1" />
        </form>
      </main>

      <!-- v1.5 : HUD navigateur DOCKÉ À DROITE, même coquille que le rendu.
           Au NIVEAU DU CORPS (pas dans l'en-tête) : position:fixed reste
           prisonnier d'un ancêtre transformé, donc imbriqué dans .chat-tete
           il n'aurait pris que la hauteur de l'en-tête. La page réserve sa
           largeur en padding-right (.page-demo.hud-ouvert), comme le rendu. -->
      <div id="hud-navigateur" class="navigateur-hud" hidden role="region" aria-label="Navigateur du modèle">
        <div id="navigateur-bord" class="navigateur-bord" role="separator" aria-orientation="vertical" title="Glisser pour redimensionner le HUD"></div>
        <div class="navigateur-tete">
          <span class="navigateur-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.4 2.6 3.6 5.6 3.6 9s-1.2 6.4-3.6 9c-2.4-2.6-3.6-5.6-3.6-9S9.6 5.6 12 3z"/></svg></span>
          <span id="navigateur-nom" class="navigateur-nom">Navigateur du modèle</span>
          <div class="navigateur-actions">
            <!-- v1.6 : barre d'outils réelle — un panneau qui affiche une page
                 sans retour arrière ni recharge n'est pas un navigateur, et un
                 mauvais clic ne se rattrapait pas. -->
            <button id="navigateur-precedent" class="btn-navigateur-fermer hnav-outil" type="button" title="Page précédente (retour)" aria-label="Page précédente" disabled>
              <svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button id="navigateur-suivant" class="btn-navigateur-fermer hnav-outil" type="button" title="Page suivante" aria-label="Page suivante" disabled>
              <svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </button>
            <button id="navigateur-recharger" class="btn-navigateur-fermer hnav-outil" type="button" title="Recharger la page" aria-label="Recharger la page">
              <svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
            </button>
            <button id="navigateur-session" class="btn-navigateur-fermer hnav-outil" type="button" title="Fermer la session Firefox (la page du modèle)" aria-label="Fermer la session du navigateur">
              <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
            </button>
            <button id="navigateur-fermer" class="btn-navigateur-fermer" type="button" title="Fermer le navigateur (Échap)" aria-label="Fermer le navigateur">
              <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <!-- barre d'adresse : éditable, Entrée = ouvrir -->
          <input id="navigateur-url" class="hnav-url" type="text" spellcheck="false" autocomplete="off"
                 placeholder="Adresse du modèle — Entrée pour ouvrir" aria-label="Adresse de la page">
          <!-- bandeau d'état : erreurs de geste, occupé, session fermée -->
          <div id="navigateur-info" class="hnav-info" role="status" hidden></div>
        </div>
        <div id="navigateur-corps" class="navigateur-corps" tabindex="0"></div>
      </div>

      <!-- v20261001 : HUD interpréteur HTML ancré à DROITE — la page
           (.page-demo) réserve sa largeur en padding-right : la conversation
           et la barre latérale se réadaptent, jamais recouvertes. Code masqué
           par défaut (rendu seul) ; iframe sandboxée à l'exécution. -->
      <div id="interpreteur" class="interpreteur" hidden role="region" aria-labelledby="interpreteur-nom">
        <div id="interpreteur-bord" class="interpreteur-bord" role="separator" aria-orientation="vertical" title="Glisser pour redimensionner le HUD"></div>
        <div class="interpreteur-tete">
          <span class="interpreteur-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4m8-8 4 4-4 4"/></svg></span>
          <span id="interpreteur-nom" class="interpreteur-nom">sans-titre.html</span>
          <div class="interpreteur-actions">
            <button id="interpreteur-toggle" class="btn-interpreteur" type="button" aria-pressed="true" title="Afficher ou masquer le code source">Code</button>
            <button id="interpreteur-exe" class="btn-interpreteur btn-interpreteur-plein" type="button" title="Exécuter le code (Ctrl+Entrée)">Exécuter</button>
            <button id="interpreteur-fermer" class="btn-interpreteur" type="button" title="Fermer l’interpréteur (Échap)" aria-label="Fermer l’interpréteur">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </div>
        <div id="interpreteur-corps" class="interpreteur-corps">
          <textarea id="interpreteur-code" class="interpreteur-code" spellcheck="false" aria-label="Code HTML à interpréter"></textarea>
          <div id="interpreteur-split" class="interpreteur-split" role="separator" aria-orientation="vertical" title="Glisser pour ajuster la largeur du code et du rendu"></div>
          <div class="interpreteur-apercu">
            <iframe id="interpreteur-cadre" class="interpreteur-cadre" title="Rendu de l’interpréteur" sandbox="allow-scripts allow-modals allow-popups"></iframe>
          </div>
        </div>
      </div>
    </div>

    <!-- Chargeur de thème importé (/api/design) AVANT l'application. -->
    <script src="./design/theme-loader.js"></script>
    <!-- Clés API des modèles cloud (voir keys.js) + interception /api/* → providers réels. -->
    <script src="./keys.js?v=20260925cs"></script>
