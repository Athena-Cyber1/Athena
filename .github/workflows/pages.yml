name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate publication assets
        run: node tools/prepare-assets.js
      # §8.4 — tests/CI : contract HTML/ids/UI + intégration local-agent
      # (auto-start :3020 dans le runner, port libre).
      - name: Static checks
        run: node tools/check.js
      # v20261011 (fa) — le garde de cache compare des empreintes, et le
      # depot est ecrit en CRLF cote Windows. Sous Linux, le checkout sort en
      # LF : meme contenu, octets differents. Ce test verifie que le garde
      # distingue les deux cas — il doit ACCEPTER la conversion de fin de
      # ligne et REFUSER une vraie modification. Sans lui, la correction du
      # garde resterait non prouvee.
      - name: Cache (fins de ligne et vraie modification)
        run: node tests/cache-eol.test.cjs
      # v20261011 — le shader Three.js de `animation-threejs.html` ne
      # compilait pas : `attribute vec3 color` redeclare (Three.js l'injecte
      # deja) et `uPixelRatio` utilise sans etre declare. Resultat : rien
      # ne s'affiche, et l'erreur ne se voit que dans la console du
      # navigateur. Ce controle statique tourne partout ; la compilation
      # REELLE (WebGL) est une sonde navigateur, reservee au poste.
      - name: Shader Three.js (declarations, uniforms, backticks)
        run: npm run test:shader
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund
      - name: Integration tests (local-agent)
        run: npm run test:agent
      - name: Bench (jsdom)
        run: npm run test:bench
      - name: Shim (pauses + traces + effort + cot)
        run: npm run test:shim
      # §8.7-6 — boucle « modèle propose, harnais dispose » : scénarios
      # exec / lecture / écriture+relecture / plan + non-régression (arrêts).
      - name: Boucle outils (scenarios non-regression)
        run: npm run test:boucle
      # §8.8 — le rendu markdown était le seul chemin non testé où une
      # régression de sanitisation ouvrirait une XSS sans qu'aucun signal
      # ne tire (15 vecteurs vérifiés sur le DOM parsé).
      - name: Sanitation markdown (XSS)
        run: npm run test:xss
      # v20261008 — la coloration syntaxique est le seul endroit du rendu où
      # une erreur ne casse rien : elle rend le code illisible, ou injecte du
      # HTML issu du texte du modèle, sans qu'aucune porte ne bronche.
      # Le test vérifie le DOM parsé, la fidélité du texte exécuté, la couverture
      # de la table CSS et le contraste mesuré des jetons.
      - name: Coloration syntaxique (vendor, couverture, contraste)
        run: npm run test:coloration
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
